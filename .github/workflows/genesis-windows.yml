name: Genesis Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - nx2
      - "genesis/**"
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "tools/**"
      - "cpmfile.json"
      - ".github/workflows/genesis-windows.yml"

permissions:
  contents: read

concurrency:
  group: genesis-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x86_64 (Genesis)
    runs-on: windows-2022
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-genesis-win-v1-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-genesis-win-v1-

      - name: Restore sccache
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: .sccache
          key: sccache-genesis-win-v1-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            sccache-genesis-win-v1-

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DYUZU_TESTS=ON
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=ON
          -DUSE_DISCORD_PRESENCE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build Genesis and unit tests
        shell: bash
        run: |
          sccache --zero-stats
          cmake --build build/release --target yuzu yuzu-cmd game_list_discovery_tests --parallel
          sccache --show-stats

      - name: Run discovery & index unit tests
        shell: pwsh
        run: |
          ./build/release/bin/game_list_discovery_tests.exe

      - name: Stop sccache
        if: always()
        shell: pwsh
        run: sccache --stop-server

      - name: Save sccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Package Genesis Windows binary
        shell: pwsh
        run: |
          $stage = "build/package"
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($exe in 'genesis.exe', 'eden-cli.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) {
              throw "build/release/bin/$exe was not produced"
            }
            Copy-Item "build/release/bin/$exe" "$stage/$exe"
          }
          if (Test-Path "build/release/bin/nx2_switches.txt") {
            Copy-Item "build/release/bin/nx2_switches.txt" "$stage/nx2_switches.txt"
          }
          windeployqt --release --no-translations "$stage/genesis.exe"
          if (-not (Test-Path "$stage/imageformats/qsvg.dll")) {
            throw "windeployqt did not deploy imageformats/qsvg.dll (required for Genesis SVG icons)"
          }

      - name: Upload Genesis Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: Genesis-Windows-x64-${{ github.sha }}
          path: build/package/
          if-no-files-found: error
          retention-days: 14
